<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel SGM+</title>
    <link href="../assets/img/favicon_io/favicon.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="admin.css" rel="stylesheet" />
  </head>
  <body>
    <!-- LOGIN -->
    <section id="login" class="login" hidden>
      <form id="login-form" class="login-card" autocomplete="on">
        <img src="../assets/img/logo-removebg-preview.png" alt="SGM+" class="login-logo" />
        <h1>Panel de la web</h1>

        <label for="login-user">Tu nombre</label>
        <input id="login-user" name="username" autocomplete="username" required placeholder="Ej: Lorena" />

        <label for="login-pass">Contraseña</label>
        <div class="pass-wrap">
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="eye-btn" id="login-eye" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i> Ver</button>
        </div>

        <label class="check">
          <input type="checkbox" id="login-remember" checked />
          Recordarme en esta computadora
        </label>

        <button type="submit" class="btn btn-primary btn-big btn-block" id="login-submit">Entrar</button>
        <p id="login-error" class="error" role="alert" hidden></p>
        <p class="muted small" id="login-hint" hidden>
          Todavía no hay contraseña configurada: ingresá con el token de GitHub y después creala en «Cambiar contraseña».
        </p>
        <a href="../" class="back-link"><i class="bi bi-arrow-left"></i> Volver a la web</a>
      </form>
    </section>

    <!-- APP -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <button type="button" class="brand" id="home-btn">
          <img src="../assets/img/logo-removebg-preview.png" alt="" />
          <span>Panel SGM+</span>
        </button>
        <div class="topbar-actions">
          <a href="../" target="_blank" rel="noopener" class="btn btn-ghost"><i class="bi bi-globe2"></i> <span class="hide-sm">Ver la web</span></a>
          <button type="button" class="btn btn-ghost" id="logout-btn"><i class="bi bi-box-arrow-right"></i> <span class="hide-sm">Salir</span></button>
        </div>
      </header>

      <main class="content" id="content"></main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input type="file" id="file-input" accept="image/*" hidden />

    <script src="admin.js"></script>
  </body>
</html>
